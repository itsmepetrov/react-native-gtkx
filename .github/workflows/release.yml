# Tag push (v*) → .deb packages of the example apps for amd64 + arm64, plus a
# zstd-compressed single executable of the Metro-path app, attached to a GitHub
# Release. Runs in the same ubuntu:26.04 container as CI (codegen needs GTK dev
# + introspection packages).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  debs:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      HUSKY: 0
    steps:
      - name: System dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev gobject-introspection \
            libgirepository1.0-dev build-essential pkg-config python3 \
            curl ca-certificates git zstd
      - name: Node 24
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
      - uses: actions/checkout@v7
      - name: Install and codegen
        run: |
          npm install
          npm run codegen
      - name: Build example apps
        run: |
          npm run build:dist
          (cd examples/monitor && npm run build)
          (cd examples/gallery && npm run build)
          (cd examples/tasks-app && npm run build)
          # The same app on the navigator, so a release ships both shapes:
          # tasks-app builds its window by hand, tasks-nav gets it from
          # createSidebarNavigator (see examples/tasks-nav/README.md).
          (cd examples/tasks-nav && npm run build)
          # Metro path. --standalone, not the app's own `npm run build`: the
          # plain build-linux artifact (dist/main.jsbundle) is not
          # self-contained, and packaging it means shipping a runtime
          # node_modules — which measured 10,515 files and 206 MiB installed
          # in v0.2.0-alpha.1, for a 369 KB bundle. --standalone is the same
          # app as one 6.9 MB .cjs on a system node. The app keeps the cheap
          # plain build as its default; the release wants the shippable one.
          (cd examples/hn-app && npx react-native build-linux --standalone)
      - name: Build debs
        run: |
          # --artifact is declared, not detected: --standalone writes BOTH
          # dist/main.jsbundle and dist/hn-app.cjs, so no filename probe can
          # tell the script which one it was asked to package.
          VERSION="${GITHUB_REF_NAME#v}"
          node scripts/build-deb.ts monitor "System Monitor" "$VERSION" debs --artifact vite
          node scripts/build-deb.ts gallery "RN Gallery" "$VERSION" debs --artifact vite
          node scripts/build-deb.ts tasks-app "Tasks" "$VERSION" debs --artifact vite
          node scripts/build-deb.ts tasks-nav "Tasks (nav)" "$VERSION" debs --artifact vite
          node scripts/build-deb.ts hn-app "Hacker News" "$VERSION" debs --artifact standalone
          ls -la debs/
      - name: Build the single executable (hn-app)
        run: |
          # An EXTRA artifact, never a replacement for the .deb: the debs above
          # are how you install these apps. This is the one file to hand
          # someone who has no Node at all — build-linux --sea wraps the app in
          # a copy of the Node binary. Metro-path only (docs/guide/packaging.md
          # explains why the vite path cannot do this), so hn-app is the whole
          # list.
          #
          # Still runs after the debs: --sea re-bundles with Metro and drops
          # its own scratch files (sea-bundle.cjs, sea-prep.blob) into the
          # same dist/ the deb step reads from. It no longer overwrites that
          # step's input — dist/hn-app.cjs is not a name --sea writes — but
          # keeping the order means the debs never wait on the slowest step.
          (cd examples/hn-app && npx react-native build-linux --sea)
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p sea
          # 104 MiB -> 29 MiB. Uploading it uncompressed is not defensible for
          # a download this size; zstd carries the executable bit through, so
          # `zstd -d` is the entire install step.
          zstd -19 -T0 \
            -o "sea/react-native-gtkx-hn-app_${VERSION}_${{ matrix.arch }}.zst" \
            examples/hn-app/dist/hn-app
          ls -la sea/
      - uses: actions/upload-artifact@v7
        with:
          name: debs-${{ matrix.arch }}
          path: debs/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: sea-${{ matrix.arch }}
          path: sea/*.zst

  release:
    needs: debs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la assets/
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            assets/*.deb assets/*.zst
