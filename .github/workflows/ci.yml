# CI runs in an ubuntu:26.04 container: GitHub's ubuntu-latest runner ships GTK 4.14,
# while gtkx needs GTK >= 4.20 (26.04 has 4.22).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: System dependencies (GTK4 + introspection + headless Wayland)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev gobject-introspection \
            libgirepository1.0-dev sway xwayland dbus \
            build-essential pkg-config python3 curl ca-certificates git
      - name: Node 24
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
      - uses: actions/checkout@v7
      - name: Install
        run: npm install
      - name: Codegen (gtkx bindings)
        # npm install prunes the codegen store as extraneous, so codegen runs
        # after it — same quirk as local development.
        run: npm run codegen
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Docs coverage
        run: npm run docs:check
      - name: MCP data is in sync with the docs
        # src/mcp/data/generated.ts embeds doc text verbatim; nothing else
        # catches it drifting, and a stale copy makes the MCP server answer
        # from documentation that no longer exists.
        run: npm run mcp:check-data
      - name: Tests (unit + GTK components under headless sway)
        # sway refuses to start as root, so the test step runs as a dedicated
        # non-root user with its own XDG_RUNTIME_DIR.
        run: |
          useradd -m ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          install -d -m 700 -o ci -g ci /tmp/xdg
          runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/tmp/xdg GTK_A11Y=none \
            npm test
      - name: Package check (build:dist + are-the-types-wrong)
        run: runuser -u ci -- env HOME=/home/ci npm run check:package
