# CI runs in an ubuntu:26.04 container: GitHub's ubuntu-latest runner ships GTK 4.14,
# while gtkx needs GTK >= 4.20 (26.04 has 4.22).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      # husky's prepare script would otherwise set core.hooksPath here too —
      # harmless (CI never commits), but pointless, and CI is the one place
      # a hook is guaranteed not to run against a developer's own changes.
      HUSKY: 0
    steps:
      - name: System dependencies (GTK4 + introspection + headless Wayland)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev gobject-introspection \
            libgirepository1.0-dev sway xwayland dbus \
            build-essential pkg-config python3 curl ca-certificates git
      - name: Node 24
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
      - uses: actions/checkout@v7
      - name: Install
        run: npm install
      - name: Codegen (gtkx bindings)
        # npm install prunes the codegen store as extraneous, so codegen runs
        # after it — same quirk as local development.
        run: npm run codegen
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatting
        # eslint only reaches what its config covers, which is the TS/JS
        # sources — prettier also owns the markdown, YAML and JSON in the
        # repo, and nothing was checking those. main has silently landed
        # unformatted markdown before; the pre-commit hook catches it only
        # for files that were staged through it.
        run: npm run format:check
      - name: Docs coverage
        run: npm run docs:check
      - name: MCP data is in sync with the docs
        # src/mcp/data/generated.ts embeds doc text verbatim; nothing else
        # catches it drifting, and a stale copy makes the MCP server answer
        # from documentation that no longer exists.
        run: npm run mcp:check-data
      - name: Tests (unit + GTK components under headless sway)
        # sway refuses to start as root, so the test step runs as a dedicated
        # non-root user with its own XDG_RUNTIME_DIR.
        run: |
          useradd -m ci
          chown -R ci:ci "$GITHUB_WORKSPACE"
          install -d -m 700 -o ci -g ci /tmp/xdg
          runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/tmp/xdg GTK_A11Y=none \
            npm test
      - name: Package check (build:dist + are-the-types-wrong)
        run: runuser -u ci -- env HOME=/home/ci npm run check:package
      - name: Typecheck the examples against the built package
        # After check:package, which is what produces dist — the examples
        # import react-native-gtkx through its `exports` map, so they cannot
        # be checked before it exists. Nothing looked here until now, and
        # main once shipped an example importing components that did not.
        run: runuser -u ci -- env HOME=/home/ci npm run typecheck:examples
      - name: Smoke test the flagship example actually launches
        # Every other gate above exercises components under the test harness
        # or typechecks source — none of them LAUNCH a built app the way a
        # user would run it. That gap is exactly how a double gtkx-runtime
        # init shipped on main for a day (the Adw door's dynamic import
        # resolved a second, independent native addon copy, invisible to
        # every static check here) before anyone noticed by hand — see
        # .claude/epics/adw-optional/006-gallery-launch-regression.md. This
        # builds examples/gallery (the Adw profile) and asserts the actual
        # `node dist/bundle.js` output stays alive for 10s under headless
        # sway; needs the non-root "ci" user, same as the Tests step.
        run: |
          runuser -u ci -- env HOME=/home/ci XDG_RUNTIME_DIR=/tmp/xdg GTK_A11Y=none \
            node scripts/gallery-smoke.ts
