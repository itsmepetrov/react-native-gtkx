# Builds the documentation site on every PR that touches it, and deploys
# the same build to GitHub Pages on push to main. No gh-pages branch: the
# deploy job hands the build straight to actions/deploy-pages.
name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

# Only one Pages deployment at a time; a new push supersedes an in-flight
# one rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Build the website workspace
        run: npm run build -w website
      # Only the actual push-to-main deploy needs the built site as an
      # artifact — PR builds are a check, nothing downstream consumes them.
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
